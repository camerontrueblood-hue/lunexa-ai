<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyAI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  transition: 0.3s;
  overflow-x: hidden;
}

/* Realistic Moon Background */
.moon {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 600px;
  height: 600px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d9d9d9 40%, #aaaaaa 60%, #888888 80%);
  border-radius: 50%;
  box-shadow: 
    0 0 80px rgba(255,255,255,0.4),
    inset -40px -40px 80px rgba(0,0,0,0.4),
    inset 20px 20px 60px rgba(255,255,255,0.3);
  z-index: -1;
  opacity: 0.25;
}

/* Container */
.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
  text-align: center;
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  height: 150px;
  border-radius: 12px;
  padding: 15px;
  font-size: 16px;
  border: none;
  outline: none;
  margin-bottom: 20px;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.primary {
  background: #3b82f6;
  color: white;
}

.secondary {
  background: #1f2937;
  color: white;
}

.output {
  margin-top: 30px;
  padding: 20px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  display: none;
  text-align: left;
  position: relative;
}

.copy-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 12px;
  padding: 5px 10px;
}

.dark-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  background: black;
  color: white;
}

/* Light Mode */
.light-mode {
  background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
  color: black;
}

.light-mode .output {
  background: rgba(0,0,0,0.05);
}

.light-mode textarea {
  background: white;
}
</style>
</head>
<body>

<div class="moon"></div>

<button class="dark-toggle" onclick="toggleDarkMode()">Toggle Mode</button>

<div class="container">
  <h1>🌙 StudyAI</h1>
  <p>Paste your notes or transcript below</p>

  <textarea id="inputText" placeholder="Paste audio transcript here..."></textarea>

  <div class="buttons">
    <button class="primary" onclick="generateSummary()">Summary</button>
    <button class="primary" onclick="generateFlashcards()">Flashcards</button>
    <button class="primary" onclick="generateQuiz()">Quiz</button>
  </div>

  <div class="output" id="outputBox">
    <button class="secondary copy-btn" onclick="copyOutput()">Copy</button>
    <div id="outputText"></div>
  </div>
</div>

<script>
function openChatGPT(prompt) {
  const encodedPrompt = encodeURIComponent(prompt);
  const url = `https://chat.openai.com/?q=${encodedPrompt}`;
  window.open(url, "_blank"); // opens in a new tab
}

function generateSummary() {
  let text = document.getElementById("inputText").value;
  if (!text) return alert("Paste text first.");
  
  let prompt = "Summarize the following transcript in detailed, structured bullet points:\n\n" + text;
  openChatGPT(prompt);
}

function generateFlashcards() {
  let text = document.getElementById("inputText").value;
  if (!text) return alert("Paste text first.");

  let prompt = "Create detailed flashcards (Q&A format) from this transcript:\n\n" + text;
  openChatGPT(prompt);
}

function generateQuiz() {
  let text = document.getElementById("inputText").value;
  if (!text) return alert("Paste text first.");

  let prompt = "Create a multiple choice quiz (10 questions with answers at the bottom) based on this transcript:\n\n" + text;
  openChatGPT(prompt);
}

function toggleDarkMode() {
  document.body.classList.toggle("light-mode");
}
</script>



</body>
</html>
