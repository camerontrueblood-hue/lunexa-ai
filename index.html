<!DOCTYPE html>
<html>
<head>
  <title>LUNEXA.AI</title>
  <style>
    body {
      font-family: Arial;
      background: #5e2ca5;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    textarea {
      width: 85%;
      height: 200px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      background: white;
      color: #5e2ca5;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    #output {
      margin-top: 20px;
      white-space: pre-wrap;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      width: 85%;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
  </style>
</head>
<body>

<svg width="100" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="white" stroke="#5e2ca5" stroke-width="6"/>
</svg>

<h1>LUNEXA.AI</h1>
<p>Paste your lecture transcript below</p>

<textarea id="transcript" placeholder="Paste transcript here..."></textarea>
<br>

<button onclick="generateSummary()">Summary</button>
<button onclick="generateQuiz()">Quiz</button>
<button onclick="generateFlashcards()">Flashcards</button>

<div id="output"></div>

<script>
function getText() {
  return document.getElementById("transcript").value;
}

function generateSummary() {
  const prompt = `
From this lecture transcript:

${getText()}

Give me:
- A very detailed structured summary
- Key definitions
- Important concepts
- Examples explained clearly
- Possible test topics
`;
  document.getElementById("output").innerText = prompt;
}

function generateQuiz() {
  const prompt = `
From this lecture transcript:

${getText()}

Create:
- 10 multiple choice questions
- 4 answer choices each
- Clearly mark the correct answer
- Include short explanations for answers
`;
  document.getElementById("output").innerText = prompt;
}

function generateFlashcards() {
  const prompt = `
From this lecture transcript:

${getText()}

Create:
- 12 flashcards
- Format as:
  Q: ...
  A: ...
- Focus on definitions, key ideas, and test material
`;
  document.getElementById("output").innerText = prompt;
}
</script>

</body>
</html>
